<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff8ed">
<title>果果合合 · 水果2048</title>
<style>
:root{--ink:#49372e;--muted:#a18b7d;--paper:#fff8ed;--board:#f0dfca;--accent:#ff8d62;--shadow:0 14px 38px #72482617}
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding-bottom:max(22px,env(safe-area-inset-bottom));padding-top:max(22px,env(safe-area-inset-top));background:radial-gradient(ellipse at 50% 0%,#fff 0,#fff8ed 52%,#f8eedf 100%);font-family:ui-rounded,"SF Pro Rounded","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center;padding:22px 14px}.app{width:min(100%,440px)}header{text-align:center;margin:0 0 18px}.eyebrow{font-size:11px;letter-spacing:.24em;color:#c69b77;font-weight:800}.title{font-size:36px;line-height:1.12;letter-spacing:.04em;margin:6px 0 6px;font-weight:950}.title span{color:#ff946c}.subtitle{font-size:13px;color:var(--muted);margin:0}.scores{display:flex;gap:10px;margin:20px 0 14px}.scorebox{flex:1;background:#fffdf8;border:1px solid #f4e7d5;border-radius:16px;padding:9px 13px;box-shadow:0 4px 12px #7653340b}.scorebox label{display:block;color:#b69a84;font-size:10px;font-weight:800;letter-spacing:.12em}.scorebox strong{display:block;font-size:23px;line-height:1.2;font-variant-numeric:tabular-nums}.toprow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.hint{font-size:12px;color:var(--muted)}.buttons{display:flex;gap:7px}.btn{border:0;border-radius:11px;background:#fffdf8;color:#816650;padding:9px 12px;font-size:12px;font-weight:800;box-shadow:0 3px 10px #76533410;cursor:pointer;transition:transform .15s,background .15s}.btn:hover{transform:translateY(-1px);background:#fff}.btn.primary{background:#ff946c;color:#fff}.board{background:var(--board);border-radius:22px;padding:11px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px;box-shadow:inset 0 2px 5px #a47c5420,var(--shadow);touch-action:none;user-select:none}.cell{aspect-ratio:1;border-radius:15px;background:#e8d5bd;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:15px;animation:pop .2s cubic-bezier(.2,1.5,.5,1);will-change:transform}.fruit{font-size:clamp(30px,9vw,49px);line-height:1;filter:drop-shadow(0 3px 1px #6938171c)}.fname{font-size:9px;font-weight:900;letter-spacing:.06em;margin-top:3px;opacity:.66}.v0{background:#f8eddf}.v1{background:#fff0c2}.v2{background:#ffd8c2}.v3{background:#ffc4c0}.v4{background:#f6c1de}.v5{background:#d8ccfa}.v6{background:#c7e8d3}.v7{background:#bfe4eb}.v8{background:#f2df9b}.v9{background:#d2e8a5}.v10{background:#f6bda0}.tile.merged{animation:merge .25s cubic-bezier(.2,1.6,.5,1)}@keyframes pop{from{transform:scale(.72);opacity:.4}to{transform:scale(1);opacity:1}}@keyframes merge{0%{transform:scale(.78)}55%{transform:scale(1.14)}100%{transform:scale(1)}}.bottom{display:flex;align-items:center;justify-content:space-between;margin:15px 2px 0;color:#a18b7d;font-size:11px}.target{display:flex;align-items:center;gap:5px}.target b{font-size:18px}.overlay{position:fixed;inset:0;background:#3a2a2066;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.overlay.show{display:flex}.modal{width:min(340px,100%);background:#fffaf2;border-radius:24px;padding:26px;text-align:center;box-shadow:0 20px 70px #29190f44;animation:pop .25s}.modal .big{font-size:60px}.modal h2{margin:5px 0;font-size:24px}.modal p{color:var(--muted);font-size:14px;line-height:1.7}.modal .btn{margin-top:10px;padding:12px 22px;font-size:14px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;background:#49372e;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:370px){.title{font-size:31px}.board{gap:7px;padding:9px}.cell,.tile{border-radius:12px}.fname{font-size:8px}}
</style></head>
<body><main class="app"><header><div class="eyebrow">SWEET LITTLE PUZZLE</div><h1 class="title">果果<span>合合</span></h1><p class="subtitle">把相同的水果碰在一起，合成更甜的惊喜！</p></header>
<div class="scores"><div class="scorebox"><label>本局得分</label><strong id="score">0</strong></div><div class="scorebox"><label>历史最佳</label><strong id="best">0</strong></div></div>
<div class="toprow"><span class="hint">在棋盘上滑动，或用方向键移动</span><div class="buttons"><button class="btn" id="undo">↶ 撤销</button><button class="btn primary" id="new">新游戏</button></div></div>
<div class="board" id="board" role="application" aria-label="水果2048游戏棋盘"></div>
<div class="bottom"><span>🍃 慢慢玩，享受合成的快乐</span><span class="target">终极目标 <b>🍉</b></span></div></main>
<div class="overlay" id="overlay"><div class="modal"><div class="big" id="modalFruit">🍉</div><h2 id="modalTitle">太棒啦！</h2><p id="modalText">你合成了西瓜！还想继续挑战吗？</p><button class="btn primary" id="continue">继续玩</button><button class="btn" id="restart">再来一局</button></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const fruits=[['🍒','樱桃'],['🍓','草莓'],['🍇','葡萄'],['🍊','橘子'],['🍋','柠檬'],['🍑','桃子'],['🍍','菠萝'],['🍈','蜜瓜'],['🍎','苹果'],['🥥','椰子'],['🍉','西瓜']];
const boardEl=document.querySelector('#board'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay');
let grid,score,best=+(localStorage.getItem('fruitBest')||0),won=false,over=false,previous=null,mergedSet=new Set(),animating=false;bestEl.textContent=best;
const fresh=()=>{grid=Array(16).fill(0);score=0;won=false;over=false;previous=null;spawn();spawn();render();overlay.classList.remove('show')};
function spawn(){const empty=[];grid.forEach((v,i)=>{if(!v)empty.push(i)});if(!empty.length)return null;let i=empty[Math.random()*empty.length|0];grid[i]=Math.random()<.9?1:2;return i}
function render(sources=null,spawned=null){let oldRects=[...boardEl.children].map(c=>c.getBoundingClientRect());boardEl.innerHTML='';grid.forEach((v,i)=>{let c=document.createElement('div');c.className='cell';if(v){let t=document.createElement('div');t.className=`tile v${Math.min(v-1,10)}${mergedSet.has(i)?' merged':''}`;t.innerHTML=`<span class="fruit">${fruits[Math.min(v-1,10)][0]}</span><span class="fname">${fruits[Math.min(v-1,10)][1]}</span>`;c.appendChild(t)}boardEl.appendChild(c)});if(sources){let cells=[...boardEl.children];sources.forEach((from,to)=>{if(to===spawned)return;let tile=cells[to].firstElementChild,a=oldRects[from],b=cells[to].getBoundingClientRect();if(tile&&a)tile.animate([{transform:`translate(${a.left-b.left}px,${a.top-b.top}px) scale(.92)`},{transform:'translate(0,0) scale(1)'}],{duration:220,easing:'cubic-bezier(.22,.72,.26,1)',fill:'both'})})}scoreEl.textContent=score;bestEl.textContent=best;mergedSet.clear()}
function linesFor(dir){let lines=[];for(let n=0;n<4;n++){let line=[];for(let k=0;k<4;k++){let r,c;if(dir==='left'){r=n;c=k}else if(dir==='right'){r=n;c=3-k}else if(dir==='up'){r=k;c=n}else{r=3-k;c=n}line.push(r*4+c)}lines.push(line)}return lines}
function move(dir){if(over||animating)return;let before=grid.slice(),beforeScore=score,changed=false,sources=new Map();mergedSet.clear();for(const line of linesFor(dir)){let vals=line.map(i=>({value:grid[i],source:i})).filter(x=>x.value),out=[];for(let k=0;k<vals.length;k++){if(vals[k].value===vals[k+1]?.value){let nv=vals[k].value+1;out.push({value:nv,source:vals[k].source});score+=nv*10;k++;let pos=line[out.length-1];mergedSet.add(pos);if(nv>=11&&!won){won=true;setTimeout(()=>showModal(true),450)}}else out.push(vals[k])}while(out.length<4)out.push({value:0,source:null});line.forEach((idx,k)=>{if(grid[idx]!==out[k].value)changed=true;grid[idx]=out[k].value;if(out[k].source!==null)sources.set(idx,out[k].source)})}if(!changed)return;previous={grid:before,score:beforeScore};if(mergedSet.size&&navigator.vibrate)navigator.vibrate(18);let spawned=spawn();render(sources,spawned);animating=true;setTimeout(()=>{animating=false;if(!canMove()){over=true;showModal(false)}},250);if(score>best){best=score;localStorage.setItem('fruitBest',best);bestEl.textContent=best}}
function canMove(){for(let i=0;i<16;i++){if(!grid[i])return true;let r=i>>2,c=i%4;if(c<3&&grid[i]===grid[i+1]||r<3&&grid[i]===grid[i+4])return true}return false}
function showModal(win){document.querySelector('#modalFruit').textContent=win?'🍉':'🧺';document.querySelector('#modalTitle').textContent=win?'西瓜大丰收！':'水果装满啦！';document.querySelector('#modalText').textContent=win?'你合成了终极西瓜，太厉害了！还可以继续挑战更高分。':'棋盘被水果填满了，再来一局继续合成吧！';document.querySelector('#continue').style.display=win?'inline-block':'none';overlay.classList.add('show')}
function undo(){if(!previous){toast('还没有可以撤销的步数');return}grid=previous.grid;score=previous.score;previous=null;over=false;won=false;render();toast('已撤销上一步')}
function toast(msg){let el=document.querySelector('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1400)}
document.addEventListener('keydown',e=>{let m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(m){e.preventDefault();move(m)}if(e.key.toLowerCase()==='u')undo()});document.querySelector('#new').onclick=fresh;document.querySelector('#restart').onclick=fresh;document.querySelector('#continue').onclick=()=>overlay.classList.remove('show');document.querySelector('#undo').onclick=undo;
let pointerStart=null;boardEl.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pointerStart={id:e.pointerId,x:e.clientX,y:e.clientY};boardEl.setPointerCapture(e.pointerId)});boardEl.addEventListener('pointerup',e=>{if(!pointerStart||e.pointerId!==pointerStart.id)return;let dx=e.clientX-pointerStart.x,dy=e.clientY-pointerStart.y;pointerStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))>22)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});boardEl.addEventListener('pointercancel',()=>{pointerStart=null});
fresh();
})();
</script></body></html>
